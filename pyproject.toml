[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lucius"
version = "0.1.0"
description = "Continual-learning Blender GUI agent: demonstrations -> skills -> memory -> retrieval -> execution -> evaluation -> correction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
anthropic = ["anthropic>=1.0"]
media = ["opencv-python-headless>=4.9"]
capture = ["mss>=9.0", "pynput>=1.7"]
blender = ["bpy>=4.2"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = ["lucius[api,anthropic,media,capture]"]

[project.scripts]
lucius = "lucius.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lucius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "bpy: requires the Blender `bpy` module (pip install bpy)",
  "xvfb: requires an X display (Xvfb) for real screen/input capture",
  "media: requires opencv-python-headless",
]
addopts = "-q"
